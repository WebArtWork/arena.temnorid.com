<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Page Not Found</title>
	<link rel="icon" data-asset="favicon.ico" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" data-asset="favicon.png" href="/favicon.png">
	<!-- GitHub Pages serves this file for any missing path, at any depth, so it cannot rely on
	     relative links: styles are inline and the home link is worked out from the address. -->
	<style>
		:root { color-scheme: dark; --bg: #0f0d14; --line: #2a2536; --text: #ece8f4; --muted: #a69fb6; --accent: #a77bff; --accent-strong: #c4a6ff; --ink: #120c1f; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
			background: radial-gradient(60% 50% at 50% 30%, #2b1d4a 0%, transparent 70%), var(--bg);
			color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
		main { max-width: 32em; }
		.logo { width: min(360px, 80vw); height: auto; display: block; margin: 0 auto -8px; }
		.code { font: 700 clamp(4rem, 18vw, 8rem)/1 Georgia, serif; color: var(--accent-strong); letter-spacing: .04em; margin: 0; }
		h1 { font: 700 1.6rem/1.3 Georgia, serif; margin: 12px 0; }
		p { color: var(--muted); margin: 0 0 28px; }
		.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
		a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 10px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--text); }
		a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
		a.btn:hover { border-color: var(--accent-strong); }
		a.btn.primary:hover { background: var(--accent-strong); }
		a:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
	</style>
</head>
<body>
	<main>
		<a data-home href="/"><img class="logo" data-asset="logo.png" src="/logo.png" alt="Temnorid Arena" width="1774" height="887"></a>
		<p class="code" aria-hidden="true">404</p>
		<h1>This page blinked away</h1>
		<p>Nothing lives at this address. It may have moved, or the link has a typo.</p>
		<div class="actions">
			<a class="btn primary" data-home href="/">Back to Temnorid Arena</a>
			<a class="btn" data-home="#download" href="/#download">Download the game</a>
		</div>
	</main>
	<script>
		// On <user>.github.io/<repo>/ the site lives under /<repo>/; on a custom domain it is the root.
		(function () {
			var base = "/";
			if (/\.github\.io$/.test(location.hostname)) {
				var first = location.pathname.split("/")[1];
				if (first) base = "/" + first + "/";
			}
			document.querySelectorAll("[data-home]").forEach(function (a) {
				a.href = base + a.getAttribute("data-home");
			});
			document.querySelectorAll("[data-asset]").forEach(function (el) {
				el[el.tagName === "IMG" ? "src" : "href"] = base + el.getAttribute("data-asset");
			});
		})();
	</script>
</body>
</html>
