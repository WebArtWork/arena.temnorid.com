<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page not found | Temnorid Arena</title>
	<meta name="description" content="This page does not exist. Go back to the Temnorid Arena home page.">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#0f0d14">
	<style>
		:root { --accent: #3fb7a8; --bg: #0f0d14; --panel: #1a1722; --line: #2d2838; --text: #e9e6f0; --muted: #a9a3b8; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 17px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
		a { color: var(--accent); }
		header.site { border-bottom: 1px solid var(--line); }
		.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; width: 100%; }
		header.site .wrap { padding-top: 14px; padding-bottom: 14px; }
		.brand { font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: .02em; }
		main { flex: 1; display: flex; align-items: center; background: radial-gradient(900px 300px at 50% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent); }
		.code { color: var(--accent); font-weight: 700; letter-spacing: .12em; font-size: 13px; text-transform: uppercase; margin: 0 0 10px; }
		h1 { font-size: clamp(34px, 7vw, 56px); line-height: 1.08; margin: 0 0 14px; }
		p { color: var(--muted); max-width: 560px; margin: 0 0 28px; }
		.btn { display: inline-block; background: var(--accent); color: #111; font-weight: 700; padding: 13px 24px; border-radius: 10px; text-decoration: none; }
		.btn:hover { filter: brightness(1.1); }
		footer { padding: 24px 0 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
	</style>
</head>
<body>
	<header class="site">
		<div class="wrap"><a class="brand" href="/">Temnorid Arena</a></div>
	</header>
	<main>
		<div class="wrap">
			<p class="code">Error 404</p>
			<h1>Page not found</h1>
			<p>The page you are looking for does not exist or has moved. Head back to the Temnorid Arena home page to read about the game and download it.</p>
			<a class="btn" href="/">Back to Temnorid Arena</a>
		</div>
	</main>
	<footer>
		<div class="wrap">Part of <a href="https://temnorid.com">Temnorid</a></div>
	</footer>
</body>
</html>
